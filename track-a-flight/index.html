<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Notebook Arcade: 3D Flight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }

    /* Top HUD */
    #hud {
      position: absolute; top: env(safe-area-inset-top, 12px); left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
      padding: 6px 14px; color: #fff; pointer-events: auto;
    }
    .hud-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
    .hud-val { font-size: 18px; font-weight: 800; }
    #hud-resource-bar-container {
      width: 130px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; margin-top: 4px;
    }
    #hud-resource-bar { width: 100%; height: 100%; background: #38bdf8; transition: width 0.1s linear; }

    /* Selector */
    select.arena-select {
      background: #1e293b; color: #f8fafc; border: 1px solid #38bdf8;
      padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; outline: none; cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
      display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-box {
      background: #0f172a; border: 1px solid #334155; border-radius: 16px;
      padding: 24px; max-width: 360px; width: 88%; text-align: center; color: #fff;
    }
    .btn {
      display: inline-block; padding: 10px 20px; border-radius: 8px; font-weight: 700;
      font-size: 14px; border: none; cursor: pointer; text-decoration: none; margin: 6px 4px;
    }
    .btn-primary { background: #06b6d4; color: #000; }
    .btn-revive { background: #eab308; color: #000; }
    .btn-secondary { background: #334155; color: #fff; }

    #touch-guide {
      position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
      color: rgba(255,255,255,0.4); font-size: 12px; pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="flight-canvas"></canvas>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-card">
      <div class="hud-title" id="hud-resource-text">Oxygen</div>
      <div id="hud-resource-bar-container">
        <div id="hud-resource-bar"></div>
      </div>
    </div>

    <div class="hud-card" style="text-align: center;">
      <div class="hud-title">Score</div>
      <div class="hud-val" id="hud-score">0</div>
    </div>

    <div class="hud-card" style="display: flex; gap: 10px; align-items: center;">
      <div>
        <div class="hud-title">Depth</div>
        <div class="hud-val" id="hud-depth" style="color: #38bdf8;">10m</div>
      </div>
      <div>
        <div class="hud-title">Pearls</div>
        <div class="hud-val" id="hud-pearls" style="color: #facc15;">0</div>
      </div>
    </div>

    <div class="hud-card">
      <select id="arena-selector" class="arena-select">
        <option value="mantaRay">Manta Ray (Flagship)</option>
        <option value="nanoDrift">Nano Drift (Micro)</option>
        <option value="dustMote">Dust Mote (Sunbeam)</option>
        <option value="marketGlider">Market Glider (Souq)</option>
        <option value="gorgeRush">Gorge Rush (Jetpack)</option>
        <option value="microFlight">Micro Flight (1:40)</option>
        <option value="zoneSurvey">Zone Survey (Chernobyl)</option>
        <option value="tideBloom">Tide Bloom (Jellyfish)</option>
        <option value="seahorse">Seahorse (Meadow)</option>
        <option value="theVoid">The Void (Endgame)</option>
      </select>
    </div>
  </div>

  <div id="touch-guide">Drag screen to steer | WASD or Arrow Keys on Desktop</div>

  <!-- Game Over Modal -->
  <div id="game-over-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="font-size: 12px; color: #ef4444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">Flight Terminated</div>
      <h2 id="game-over-reason" style="font-size: 20px; margin-bottom: 12px;">Depleted Oxygen</h2>
      <div style="font-size: 32px; font-weight: 800; color: #38bdf8; margin-bottom: 4px;" id="final-score">0</div>
      <div style="font-size: 13px; color: #facc15; margin-bottom: 18px;" id="final-pearls">+0 Pearls</div>

      <div>
        <button id="revive-btn" class="btn btn-revive">📺 Revive (Rewarded Ad)</button>
        <button id="restart-btn" class="btn btn-primary">Play Again</button>
      </div>

      <div style="margin-top: 14px; border-top: 1px solid #334155; padding-top: 12px;">
        <button id="more-games-btn" class="btn btn-secondary" style="font-size: 12px; width: 100%;">🎮 More Games (Zero-CAC)</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { FlightEngine } from './src/FlightEngine.js';
    import { crossPromo } from '../core/crossPromo/CrossPromoModal.js';

    const engine = new FlightEngine('flight-canvas');
    engine.start();

    // Arena change handler
    document.getElementById('arena-selector').addEventListener('change', (e) => {
      engine.switchArena(e.target.value);
    });

    // Revive & Restart buttons
    document.getElementById('revive-btn').addEventListener('click', () => {
      engine.attemptRevive();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      document.getElementById('game-over-modal').style.display = 'none';
      engine.switchArena(engine.config.id);
    });

    // Zero-CAC Cross Promotion Modal
    document.getElementById('more-games-btn').addEventListener('click', () => {
      crossPromo.showPortfolioModal('track-a');
    });
  </script>
</body>
</html>
