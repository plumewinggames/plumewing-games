<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Featherweight: Caveman Chase</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }

    /* Top HUD */
    #chase-hud {
      position: absolute; top: env(safe-area-inset-top, 12px); left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10;
    }
    .hud-chip {
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
      padding: 6px 14px; color: #fff; pointer-events: auto; display: flex; align-items: center; gap: 8px;
    }

    /* Live Chase Progress Bar */
    #progress-wrapper {
      position: absolute; top: env(safe-area-inset-top, 16px); left: 50%; transform: translateX(-50%);
      width: 240px; height: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px; overflow: hidden; pointer-events: none; z-index: 12;
    }
    #chase-progress-animal {
      position: absolute; top: 0; bottom: 0; left: 0; width: 14px; background: #38bdf8; border-radius: 4px;
      transition: left 0.1s linear;
    }

    /* Touch Controls */
    .touch-controls {
      position: absolute; bottom: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; pointer-events: none; z-index: 20;
    }
    .touch-group { display: flex; gap: 14px; pointer-events: auto; }
    .touch-btn {
      width: 64px; height: 64px; border-radius: 50%; background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px); border: 2px solid rgba(255, 255, 255, 0.3); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold;
      touch-action: none;
    }
    .touch-btn:active { background: rgba(56, 189, 248, 0.5); border-color: #38bdf8; }

    /* Modals */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
      display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-box {
      background: #0f172a; border: 1px solid #334155; border-radius: 16px;
      padding: 24px; max-width: 360px; width: 88%; text-align: center; color: #fff;
    }
    .btn {
      display: inline-block; padding: 10px 20px; border-radius: 8px; font-weight: 700;
      font-size: 14px; border: none; cursor: pointer; text-decoration: none; margin: 6px 4px;
    }
    .btn-primary { background: #f97316; color: #000; }
    .btn-revive { background: #eab308; color: #000; }
    .btn-secondary { background: #334155; color: #fff; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="chase-canvas"></canvas>
  </div>

  <!-- Live Chase Progress Bar -->
  <div id="progress-wrapper">
    <div id="chase-progress-animal"></div>
  </div>

  <!-- Top HUD -->
  <div id="chase-hud">
    <div class="hud-chip">
      <span style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">Run</span>
      <span id="chase-hud-dist" style="font-weight: 800; font-size: 15px;">0m</span>
    </div>

    <div class="hud-chip">
      <span id="chase-hud-hearts">❤️❤️❤️</span>
      <span style="color: #eab308; font-weight: 800; margin-left: 8px;">🫐 <span id="chase-hud-berries">0</span></span>
    </div>

    <div class="hud-chip">
      <select id="animal-select" style="background: transparent; color: #fff; border: none; font-size: 13px; font-weight: 700; outline: none; cursor: pointer;">
        <option value="dodo" style="background: #1e293b;">Timid Dodo</option>
        <option value="mammoth" style="background: #1e293b;">Woolly Mammoth</option>
        <option value="turtle" style="background: #1e293b;">Shy Turtle</option>
        <option value="bunny" style="background: #1e293b;">Nervous Bunny</option>
        <option value="triceratops" style="background: #1e293b;">Baby Triceratops</option>
        <option value="sabreCub" style="background: #1e293b;">Sabre-Tooth Cub</option>
      </select>
    </div>
  </div>

  <!-- Touch Controls -->
  <div class="touch-controls">
    <div class="touch-group">
      <div id="touch-up" class="touch-btn">▲</div>
      <div id="touch-down" class="touch-btn">▼</div>
    </div>
    <div class="touch-group">
      <div id="touch-duck" class="touch-btn">🛡️</div>
      <div id="touch-jump" class="touch-btn">🦘</div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="chase-over-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="font-size: 12px; color: #ef4444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">Caught by Caveman</div>
      <h2 id="chase-over-reason" style="font-size: 20px; margin-bottom: 12px;">Crushed by Mallet Shockwave</h2>
      <div style="font-size: 32px; font-weight: 800; color: #f97316; margin-bottom: 4px;" id="chase-final-dist">0m</div>
      <div style="font-size: 13px; color: #facc15; margin-bottom: 18px;" id="chase-final-berries">+0 Berries</div>

      <div>
        <button id="chase-revive-btn" class="btn btn-revive">📺 Revive (5s Rewarded Ad)</button>
        <button id="chase-restart-btn" class="btn btn-primary">Try Again</button>
      </div>

      <div style="margin-top: 14px; border-top: 1px solid #334155; padding-top: 12px;">
        <button id="chase-more-games" class="btn btn-secondary" style="font-size: 12px; width: 100%;">🎮 More Games (Zero-CAC)</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
